# Web UI configuration for the local Docker test stack only.
[webui]
secret_key = docker-test-only-not-a-secret
data_dir = /var/lib/proxysql-webui
session_lifetime_minutes = 480
# plain HTTP on localhost in the test stack
secure_cookies = false

[service]
# no systemd inside containers
enabled = false

[instance:proxysql1]
label = ProxySQL node 1
host = proxysql1
port = 6032
user = radmin
password = radmin

[instance:proxysql2]
label = ProxySQL node 2
host = proxysql2
port = 6032
user = radmin
password = radmin
